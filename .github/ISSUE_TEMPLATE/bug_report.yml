name: Relatar problema
description: Reportar um erro sem divulgar informações sensíveis
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Não inclua tokens, dados pessoais ou logs privados.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do aplicativo e Android
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
